# Pangolin Stack - Dashboard
# Requires: core stack (pangolin network)

name: pangolin-dashboard

networks:
  pangolin:
    external: true

services:
  qbit-proxy:
    container_name: qbit-proxy
    networks:
      - pangolin
    build:
      context: /home/jesus/pangolin-stack/qbit-proxy
    restart: unless-stopped
    environment:
      - TARGET_HOST=torrent.dennisb.xyz
      - TARGET_IP=192.168.0.10

  homarr:
    container_name: homarr
    image: ghcr.io/homarr-labs/homarr:v2.4.0
    networks:
      - pangolin
    restart: unless-stopped
    depends_on:
      - qbit-proxy
    volumes:
      - /opt/homarr/appdata:/appdata
    ports:
      - 7575:7575
    environment:
      - SECRET_ENCRYPTION_KEY=${HOMARR_SECRET_KEY}
      - TZ=Asia/Jerusalem
    extra_hosts:
      - "torrent.dennisb.xyz:192.168.0.10"
