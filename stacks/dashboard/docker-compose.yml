# Pangolin Stack - Dashboard
# Requires: core stack (pangolin network)

name: pangolin-dashboard

networks:
  pangolin:
    external: true

services:
  qbit-proxy:
    container_name: qbit-proxy
    networks:
      - pangolin
    build:
      context: /home/jesus/pangolin-stack/qbit-proxy
    restart: unless-stopped
    environment:
      - TARGET_HOST=torrent.example.com
      - TARGET_IP=192.168.0.12

  homarr:
    container_name: homarr
    image: ghcr.io/homarr-labs/homarr:v2.11.1
    networks:
      - pangolin
    restart: unless-stopped
    depends_on:
      - qbit-proxy
    volumes:
      - /opt/homarr/appdata:/appdata
    ports:
      - "127.0.0.1:7575:7575"
    environment:
      - SECRET_ENCRYPTION_KEY=${HOMARR_SECRET_KEY}
      - TZ=Asia/Jerusalem
    # Must match the live container (`docker inspect homarr`). sonarr, radarr,
    # bazarr and profilarr are omitted: those containers are stopped and absent
    # since the 2026-11-21 move, so a pin for them only hides real DNS failures.
    extra_hosts:
      - "request.example.com:192.168.0.12"
      - "torrent.example.com:192.168.0.12"
      - "prowlarr.example.com:192.168.0.12"
      - "nasus.example.com:192.168.0.12"
      - "adguard.example.com:192.168.0.12"
      - "plex.example.com:192.168.0.12"
