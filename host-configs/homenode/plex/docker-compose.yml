services:
  plex:
    image: linuxserver/plex:latest
    container_name: plex
    restart: unless-stopped
    network_mode: host
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Jerusalem
    volumes:
      - /volume1/docker/config/plex:/config
      - /volume1/media:/media
      - /volume2/plex-db:/config/Library/Application Support/Plex Media Server/Plug-in Support/Databases
    devices:
      - /dev/dri:/dev/dri  # Enable Intel iGPU hardware transcoding
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:32400/identity >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
