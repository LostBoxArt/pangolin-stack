# Pangolin Stack - Container Management
# Requires: core stack (pangolin network)

name: pangolin-management

networks:
  pangolin:
    external: true

services:
  dockhand:
    image: fnsys/dockhand:latest
    container_name: dockhand
    networks:
      - pangolin
    restart: unless-stopped
    user: "0:0"
    group_add:
      - "986" # docker group
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/jesus/pangolin-stack/data/dockhand:/app/data
      - /opt/homelab/stacks:/opt/homelab/stacks
    environment:
      - TZ=UTC
