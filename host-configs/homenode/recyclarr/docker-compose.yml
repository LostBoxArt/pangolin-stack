# Sanitized live snapshot, 2026-10-27. Addresses use repository examples.
services:
  recyclarr:
    image: ghcr.io/recyclarr/recyclarr:8.8.0
    container_name: recyclarr
    user: 1000:1000
    restart: unless-stopped
    networks:
      - traefik_traefik
    volumes:
      - /volume1/docker/config/recyclarr:/config
    environment:
      - TZ=Asia/Jerusalem
      - CRON_SCHEDULE=@daily
      - RECYCLARR_CREATE_CONFIG=true

networks:
  traefik_traefik:
    external: true
