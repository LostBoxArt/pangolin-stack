# Pangolin Stack - User Applications
# Requires: core stack (pangolin network)

name: pangolin-apps

networks:
  pangolin:
    external: true

services:
  landing:
    image: nginx:alpine
    container_name: landing
    networks:
      - pangolin
    restart: unless-stopped
    volumes:
      - /home/jesus/pangolin-stack/sites/dennisb-landing:/usr/share/nginx/html:ro
      - /home/jesus/pangolin-stack/sites/dennisb-landing/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  termix:
    image: ghcr.io/lukegus/termix:latest
    container_name: termix
    networks:
      - pangolin
    restart: unless-stopped
    volumes:
      - termix_data:/app/data
    environment:
      - PORT=8080

volumes:
  termix_data:
    driver: local
